<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Support ticket cost calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#18181B;--subtle:#52525C;--grid:#E4E4E7;--blue:#5770FF;--good:#009966;}
  *{box-sizing:border-box}
  body{font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:var(--ink);background:#fff;margin:0;padding:24px;max-width:760px}
  h1{font-size:1.25rem;margin:0 0 4px}
  p.sub{color:var(--subtle);margin:0 0 20px;font-size:.9rem}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  label{font-weight:600;font-size:.95rem}
  input{font:inherit;font-size:1rem;padding:8px 12px;border:1px solid var(--grid);border-radius:8px;width:160px}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
  .err{color:#EF4469;font-size:.85rem;min-height:1em}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--grid)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--subtle);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  tr.best td{background:#ECFDF5;font-weight:600}
  .tag{font-size:.72rem;color:var(--good);font-weight:600;margin-left:6px}
  .note{color:var(--subtle);font-size:.8rem;margin-top:16px}
</style></head><body>
<h1>What will support cost you?</h1>
<p class="sub">Enter your monthly ticket volume to see projected cost and quality for each model-routing strategy.</p>
<div class="field">
  <label for="tickets">Tickets per month</label>
  <input id="tickets" type="number" inputmode="numeric" min="0" max="100000000" step="1" value="10000"
         aria-describedby="err" autocomplete="off">
</div>
<div id="err" class="err" role="alert"></div>
<table><thead><tr><th>Strategy</th><th>Resolved well</th><th>Monthly cost</th><th>Cost / resolved</th></tr></thead>
<tbody id="rows"></tbody></table>
<p class="note">Per-ticket costs from a 40-ticket-per-strategy eval. "Cost / resolved" = spend &divide; tickets resolved well.</p>
<script>
const DATA = [{"name": "Always big model", "cost": 0.016144, "resolved": 0.85, "color": "#5770FF"}, {"name": "Always cheapest", "cost": 0.004235, "resolved": 0.675, "color": "#F97316"}, {"name": "Cheap sweep", "cost": 0.005998, "resolved": 0.7, "color": "#FB923C"}, {"name": "Retry, then escalate", "cost": 0.011562, "resolved": 0.925, "color": "#00BC7D"}, {"name": "Rule-based router", "cost": 0.016724, "resolved": 0.85, "color": "#9F9FA9"}, {"name": "Smart escalation", "cost": 0.013529, "resolved": 0.925, "color": "#009966"}];

const MAX = 100000000;
const rowsEl = document.getElementById('rows');
const errEl = document.getElementById('err');
const input = document.getElementById('tickets');
const usd = (x, d=0) => '$' + x.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});

function sanitize(raw){
  const digits = String(raw).replace(/[^0-9]/g, '');   // digits only — rejects all non-numeric, no eval, no HTML
  if (digits === '') return {n: null, msg: 'Enter a whole number of tickets.'};
  let n = parseInt(digits, 10);
  if (!Number.isFinite(n)) return {n: null, msg: 'Invalid number.'};
  if (n > MAX) { n = MAX; return {n, msg: 'Capped at ' + MAX.toLocaleString('en-US') + ' tickets.'}; }
  return {n, msg: ''};
}
function cell(text, opts={}){
  const td = document.createElement('td');
  td.textContent = text;                               // textContent only — user input cannot inject markup
  if (opts.color){ const d=document.createElement('span'); d.className='dot'; d.style.background=opts.color; td.prepend(d); }
  if (opts.tag){ const s=document.createElement('span'); s.className='tag'; s.textContent=opts.tag; td.appendChild(s); }
  return td;
}
function render(){
  const {n, msg} = sanitize(input.value);
  errEl.textContent = msg;
  rowsEl.replaceChildren();
  if (n === null) return;
  const rows = DATA.map(d => ({...d, monthly: d.cost * n, perResolved: d.resolved > 0 ? (d.cost / d.resolved) : Infinity}));
  rows.sort((a,b) => a.monthly - b.monthly);
  const quality = rows.filter(r => r.resolved >= 0.85);
  const best = quality.length ? quality.reduce((m,r)=> r.monthly < m.monthly ? r : m) : null;
  for (const r of rows){
    const tr = document.createElement('tr');
    if (best && r.name === best.name) tr.className = 'best';
    tr.appendChild(cell(r.name, {color: r.color, tag: (best && r.name===best.name) ? 'best value' : ''}));
    tr.appendChild(cell((r.resolved*100).toFixed(0) + '%'));
    tr.appendChild(cell(usd(r.monthly, r.monthly < 100 ? 2 : 0) + '/mo'));
    tr.appendChild(cell(usd(r.perResolved, 4)));
    rowsEl.appendChild(tr);
  }
}
input.addEventListener('input', render);
render();
</script></body></html>
